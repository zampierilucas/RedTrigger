name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > redtrigger-release.jks

      - name: Create keystore.properties
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf 'storeFile=../redtrigger-release.jks\nstorePassword=%s\nkeyAlias=redtrigger\nkeyPassword=%s\n' "$KS_PASS" "$KS_PASS" > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/RedTrigger-*.apk
          generate_release_notes: true
